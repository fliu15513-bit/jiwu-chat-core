name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "后端 API 地址（如 http://154.94.235.238:9090/）"
        required: true
        default: "http://154.94.235.238:9090/"
      ws_url:
        description: "WebSocket 地址（如 ws://154.94.235.238:9091/）"
        required: true
        default: "ws://154.94.235.238:9091/"
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Generate .env.production
        shell: pwsh
        run: |
          $api = "${{ github.event.inputs.api_url }}"
          $ws  = "${{ github.event.inputs.ws_url }}"
          if (-not $api) { $api = "http://154.94.235.238:9090/" }
          if (-not $ws)  { $ws  = "ws://154.94.235.238:9091/" }
          @"
          VITE_API_BASE_URL=$api
          VITE_API_WS_BASE_URL=$ws
          "@ | Out-File -FilePath .env.production -Encoding utf8
          Get-Content .env.production

      - name: Install dependencies
        env:
          NODE_ENV: production
          SKIP_CHECK_ENV: "true"
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt (SSG)
        env:
          NODE_ENV: production
        run: pnpm run build:nuxt

      - name: Build Tauri (Windows)
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: "${{ github.event.inputs.api_url || 'http://154.94.235.238:9090/' }}"
          VITE_API_WS_BASE_URL: "${{ github.event.inputs.ws_url || 'ws://154.94.235.238:9091/' }}"
        run: pnpm run build:tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jiwuchat-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
